services:
  petclinic:
    image: springcommunity/spring-petclinic-rest:4.0.2
    # the image is published for amd64 only, on Apple Silicon it runs through emulation
    platform: linux/amd64
    container_name: petclinic
    ports:
      - "9966:9966"
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost:9966/petclinic/actuator/health"]
      interval: 5s
      timeout: 3s
      retries: 20
      start_period: 60s
